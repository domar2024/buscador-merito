<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#1d4ed8;--brand2:#0ea5e9;--ok:#16a34a;--soft:#f1f5f9;--navy:#081947}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:url("assets/bg-fesd.png") center center / cover no-repeat fixed,#0b1c4a;color:var(--ink);min-height:100vh}
header{background:linear-gradient(120deg,#081947,#1d4ed8 60%,#0ea5e9);color:#fff;padding:24px 16px 26px}
.hbrand{max-width:1000px;margin:0 auto;display:flex;gap:16px;align-items:center}
.hbrand .logo{height:72px;width:72px;object-fit:contain;background:#fff;border-radius:16px;padding:7px;box-shadow:0 8px 22px rgba(2,8,23,.35);flex:none}
.hbrand h1{margin:0;font-size:21px;line-height:1.25}
.hbrand p{margin:6px 0 0;opacity:.92;font-size:13px}
.wrap{max-width:820px;margin:-14px auto 0;padding:0 16px 40px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 14px 40px rgba(8,25,71,.14)}
.search{display:flex;gap:8px}
#q{flex:1;padding:17px 18px;border:2px solid var(--brand);border-radius:14px;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:1.2px;background:#f8fbff;color:var(--ink)}
#q:focus{outline:none;box-shadow:0 0 0 4px #bfdbfe}
button.clear{border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 16px;font-size:19px;cursor:pointer;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:10px 2px 0}
.placeholder{text-align:center;color:var(--ink);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:16px;padding:40px 18px;margin:16px 0 0;box-shadow:0 10px 30px rgba(8,25,71,.10)}
.placeholder .big{font-size:46px;margin-bottom:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0 0;box-shadow:0 10px 30px rgba(8,25,71,.10);border-left:7px solid var(--brand);animation:pop .18s ease}
.card.exc{border-left-color:var(--ok)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card .name{font-size:23px;font-weight:800;margin:0 0 4px;line-height:1.2}
.card .car{color:var(--brand);font-weight:600;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.fld .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:3px}
.fld .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-word}
.v.g{color:var(--ok)}.v.o{color:#d97706}
.badge{display:inline-block;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;border-radius:999px;padding:2px 9px;font-size:12px;margin-left:8px;vertical-align:middle}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:14px 16px;margin:16px 0 0;font-size:15px}
@media(max-width:640px){.hbrand .logo{height:58px;width:58px}.hbrand h1{font-size:18px}#q{font-size:17px}.card .name{font-size:20px}}

/* Fondo: imagen a pantalla completa (sin transparencia) */
header,.wrap{position:relative;z-index:1}
</style>

const $=s=>document.querySelector(s);
const norm=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const digits=s=>(s||'').toString().replace(/\D/g,'');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function kcolor(v){ return v>=95?'g':v>=90?'':'o'; }
function card(r){
  const exc=r[3]>=95;
  return '<div class="card'+(exc?' exc':'')+'">'
    +'<p class="name">'+esc(r[1])+(exc?'<span class="badge">⭐ excelencia</span>':'')+'</p>'
    +'<p class="car">'+esc(r[2])+'</p>'
    +'<div class="grid">'
      +'<div class="fld"><div class="k">Matrícula</div><div class="v">'+esc(r[0])+'</div></div>'
      +'<div class="fld"><div class="k">Índice</div><div class="v '+kcolor(r[3])+'">'+(r[3]==null?'—':r[3].toFixed(1))+'</div></div>'
      +'<div class="fld"><div class="k">Créditos</div><div class="v">'+(r[4]==null?'—':r[4])+'</div></div>'
      +'<div class="fld"><div class="k">Campus</div><div class="v">'+esc(r[6])+'</div></div>'
      +'<div class="fld"><div class="k">Periodo</div><div class="v">'+esc(r[5])+'</div></div>'
    +'</div></div>';
}
const EMPTY='<div class="placeholder"><div class="big">🎓</div><div>Escribe un número de matrícula para consultar la ficha.</div></div>';
function render(){
  const raw=$('#q').value.trim();
  const out=$('#out');
  if(!raw){ out.innerHTML=EMPTY; return; }
  const q=norm(raw), qd=digits(raw);
  const exact=DATA.filter(r=> norm(r[0])===q || (qd && digits(r[0])===qd));
  if(!exact.length){
    const partial=DATA.some(r=>{ const m=norm(r[0]); return m.startsWith(q)||(qd&&digits(r[0]).startsWith(qd)); });
    out.innerHTML = partial
      ? '<div class="warn">Matrícula <b>incompleta</b>. Escribe el número <b>completo</b> para ver la ficha.</div>'
      : '<div class="warn">No se encontró esa matrícula. Verifica el número.</div>';
    return;
  }
  out.innerHTML=exact.slice(0,20).map(card).join('');
}
$('#q').addEventListener('input',render);
$('#clr').addEventListener('click',()=>{$('#q').value='';render();$('#q').focus();});
render();
