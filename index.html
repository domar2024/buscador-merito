const $=s=>document.querySelector(s);
const norm=s=>(s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const digits=s=>(s||'').toString().replace(/\D/g,'');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sel=$('#carrera');
CARRERAS.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});
let chip='';
function mark(text,q){ if(!q) return esc(text); const n=norm(text); const i=n.indexOf(norm(q)); if(i<0) return esc(text); return esc(text.slice(0,i))+'<span class="hl">'+esc(text.slice(i,i+q.length))+'</span>'+esc(text.slice(i+q.length)); }
function kcolor(v){ return v>=95?'g':v>=90?'':'o'; }
function filt(){
  const raw=$('#q').value.trim(), car=$('#carrera').value;
  const q=norm(raw), qd=digits(raw);
  return DATA.filter(r=>{
    if(car && r[2]!==car) return false;
    if(chip && !(r[3]!=null && r[3]>=parseFloat(chip))) return false;
    if(q){ const m=norm(r[0]); const ok = m.includes(q) || (qd && digits(r[0]).includes(qd)); if(!ok) return false; }
    return true;
  });
}
function card(r){
  const exc=r[3]>=95;
  return '<div class="card'+(exc?' exc':'')+'">'
    +'<p class="name">'+esc(r[1])+(exc?'<span class="badge">⭐ excelencia</span>':'')+'</p>'
    +'<p class="car">'+esc(r[2])+'</p>'
    +'<div class="grid">'
      +'<div class="fld"><div class="k">Matrícula</div><div class="v">'+esc(r[0])+'</div></div>'
      +'<div class="fld"><div class="k">Índice</div><div class="v '+kcolor(r[3])+'">'+(r[3]==null?'—':r[3].toFixed(1))+'</div></div>'
      +'<div class="fld"><div class="k">Créditos</div><div class="v">'+(r[4]==null?'—':r[4])+'</div></div>'
      +'<div class="fld"><div class="k">Campus</div><div class="v">'+esc(r[6])+'</div></div>'
      +'<div class="fld"><div class="k">Periodo</div><div class="v">'+esc(r[5])+'</div></div>'
    +'</div></div>';
}
function render(){
  const raw=$('#q').value.trim();
  const rows=filt();
  const s=$('#sort').value;
  const key = s==='idx'?'3': s==='cred'?'4':'0';
  rows.sort((a,b)=>{
    if(key==='0') return String(digits(a[0])||a[0]).localeCompare(String(digits(b[0])||b[0]),undefined,{numeric:true});
    let x=a[key],y=b[key]; if(x==null)x=-1; if(y==null)y=-1; return y-x;
  });
  const det=$('#detail'); det.innerHTML='';
  if(raw){
    const shown=rows.slice(0,20);
    if(shown.length) det.innerHTML='<div class="sec">Ficha'+(rows.length>1?' del estudiante ('+rows.length+' coincidencias)':' del estudiante')+'</div>'+shown.map(card).join('');
    else det.innerHTML='<div class="card"><p class="name">Sin resultados</p><p class="car">No se encontró ninguna matrícula con ese número.</p></div>';
  }
  const tb=$('#tb'); tb.innerHTML='';
  rows.slice(0,500).forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td class="mat">'+mark(r[0],raw)+'</td>'
      +'<td>'+esc(r[1])+(r[3]>=95?'<span class="badge">⭐</span>':'')+'</td>'
      +'<td class="car2 hide-sm">'+esc(r[2])+'</td>'
      +'<td class="idx '+kcolor(r[3])+'">'+(r[3]==null?'—':r[3].toFixed(1))+'</td>'
      +'<td class="hide-sm">'+(r[4]==null?'—':r[4])+'</td>';
    tr.addEventListener('click',()=>{ window.scrollTo({top:0,behavior:'smooth'}); $('#detail').innerHTML='<div class="sec">Ficha del estudiante</div>'+card(r); });
    tb.appendChild(tr);
  });
  $('#count').textContent = rows.length + ' resultado' + (rows.length===1?'':'s') + (rows.length>500?' (mostrando 500)':'');
  if(!rows.length) tb.innerHTML='<tr><td colspan="5" class="empty">No hay coincidencias</td></tr>';
  $('#listtitle').textContent = raw ? (rows.length===1?'Coincidencia':'Coincidencias') : 'Listado completo';
}
$('#q').addEventListener('input',render);
$('#carrera').addEventListener('change',render);
$('#sort').addEventListener('change',render);
$('#clr').addEventListener('click',()=>{$('#q').value='';render();$('#q').focus();});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');chip=c.dataset.ch;render();}));
document.querySelectorAll('th[data-s]').forEach(th=>th.addEventListener('click',()=>{
  const m={mat:'mat',nom:'mat',car:'mat',idx:'idx',cred:'cred'};
  $('#sort').value=m[th.dataset.s]||'mat'; render();
}));
render();
